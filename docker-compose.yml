# RTCA Discord bot. Self-contained: no HTTP API, no published ports.
#
# Deploy:  git pull && docker compose up -d --build
#
# Requires core/secrets.py (and optionally core/github_secrets.py) next to this
# file — both are gitignored and mounted read-only, never baked into the image.
services:
  rtca.bot:
    build: .
    image: rtca-bot:latest
    container_name: rtca-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    environment:
      TZ: ${TZ:-UTC}

    volumes:
      # Secrets: copy core/secrets.example.py -> core/secrets.py first
      - ./core/secrets.py:/app/core/secrets.py:ro
      - ./core/github_secrets.py:/app/core/github_secrets.py:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - github_backup:/app/.github_backup

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  github_backup:
